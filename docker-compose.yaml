services:

    api:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "8000:8000"
      environment:
        - DB__HOST=db
        - REDIS__HOST=redis
        - APP__ENV=prod
      env_file:
       - ".env"
      restart: unless-stopped
      volumes:
        - ./keys:/app/keys
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      user: "1000:1000"

    db:
      image: postgres:18-alpine
      ports:
        - '5432:5432'
      volumes:
        - postgres_data:/var/lib/postgresql
      environment:
        - POSTGRES_DB=${DB__NAME}
        - POSTGRES_USER=${DB__USER}
        - POSTGRES_PASSWORD=${DB__PASSWORD}
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB__USER} -d ${DB__NAME}"]
        interval: 5s
        timeout: 10s
        retries: 3

    redis:
      image: redis:alpine
      ports:
        - '6379:6379'
      restart: unless-stopped
      volumes:
        - redis_data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 10s
        retries: 3

    rabbitmq:
      image: rabbitmq:alpine
      ports:
        - "5672:5672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      restart: unless-stopped
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ__LOGIN}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: